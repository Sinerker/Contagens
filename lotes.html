<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a6fd4" />
  <title>Inventários · Contagens</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="estilo.css" />
</head>
<body>
  <header class="cabecalho">
    <div class="btn-icone" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
    </div>
    <div class="cabecalho-info">
      <span class="cabecalho-titulo" id="titulo-loja">—</span>
      <span class="cabecalho-sub" id="quem">—</span>
    </div>
    <a class="btn-icone" id="link-admin" href="admin.html" hidden aria-label="Administração">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
    <button class="btn-icone" id="btn-sair" aria-label="Sair">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <main class="conteudo">
    <div class="campo">
      <label class="rotulo" for="troca-loja">Loja</label>
      <select class="lista" id="troca-loja"></select>
    </div>

    <button class="botao" id="btn-criar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Criar inventário
    </button>

    <div class="aviso aviso--ok" id="recado" hidden></div>
    <div class="aviso aviso--atencao" id="aviso-armazenamento" hidden></div>

    <div class="secao-titulo">Abertos nesta loja</div>
    <div id="abertos" style="display:flex; flex-direction:column; gap:.6rem">
      <p class="cartao-ajuda">Carregando…</p>
    </div>

    <div class="secao-titulo" style="margin-top:.5rem">Fechados recentemente</div>
    <div id="fechados" style="display:flex; flex-direction:column; gap:.6rem"></div>
  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="local.js"></script>
  <script src="lotes.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
